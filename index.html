    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Constants and State
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lifetime-line-dev';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let db, auth, currentUser = null;
        let timelineEvents = [];
        let currentPhotoBase64 = null; // Store compressed image data
        
        const START_YEAR = 1974;
        const CURRENT_YEAR = new Date().getFullYear();

        // UI Categories mapping to Pastel themes
        const CAT_THEMES = {
            'Photo': { bg: 'bg-pastel-blue', border: 'border-pastel-blueBorder', text: 'text-pastel-blueText', icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>` },
            'Trip': { bg: 'bg-pastel-green', border: 'border-pastel-greenBorder', text: 'text-pastel-greenText', icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" /></svg>` },
            'Place Lived': { bg: 'bg-pastel-orange', border: 'border-pastel-orangeBorder', text: 'text-pastel-orangeText', icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>` },
            'Job': { bg: 'bg-pastel-purple', border: 'border-pastel-purpleBorder', text: 'text-pastel-purpleText', icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>` },
            'Special Event': { bg: 'bg-pastel-pink', border: 'border-pastel-pinkBorder', text: 'text-pastel-pinkText', icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>` }
        };

        // DOM Elements
        const DOM = {
            yearSelect: document.getElementById('year-select'),
            catSelect: document.getElementById('category-select'),
            photoGroup: document.getElementById('photo-upload-group'),
            photoInput: document.getElementById('event-photo'),
            photoPreview: document.getElementById('photo-preview'),
            timelineContainer: document.getElementById('timeline-container'),
            emptyState: document.getElementById('empty-state'),
            loadingState: document.getElementById('loading-state'),
            addModal: document.getElementById('add-modal'),
            openModalBtn: document.getElementById('open-modal-btn'),
            closeModalBtn: document.getElementById('close-modal-btn'),
            addEventForm: document.getElementById('add-event-form'),
            aiStatus: document.getElementById('ai-status'),
            submitBtn: document.getElementById('submit-btn')
        };

        // Initialize UI
        for (let y = CURRENT_YEAR; y >= START_YEAR; y--) {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            DOM.yearSelect.appendChild(opt);
        }

        // Toggle Photo Input visibility based on category
        DOM.catSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Photo') {
                DOM.photoGroup.classList.remove('hidden');
            } else {
                DOM.photoGroup.classList.add('hidden');
                DOM.photoInput.value = ''; // clear
                DOM.photoPreview.classList.add('hidden');
                currentPhotoBase64 = null;
            }
        });

        // Handle Image Upload and Resizing (Canvas)
        DOM.photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Resize to max 800px to avoid 1MB Firestore limit
                    const MAX_SIZE = 800;
                    let width = img.width, height = img.height;
                    
                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width; width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height; height = MAX_SIZE;
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Compress to JPEG
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Show preview
                    DOM.photoPreview.src = currentPhotoBase64;
                    DOM.photoPreview.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        if (Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const authenticate = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Auth failed:", error);
                }
            };
            authenticate();

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) listenToEvents();
            });
        }

        function listenToEvents() {
            // Strict path rule implementation
            const eventsRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'timelineEvents');
            onSnapshot(eventsRef, (snapshot) => {
                timelineEvents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTimeline();
            }, (error) => {
                console.error("Firestore error:", error);
            });
        }

        function renderTimeline() {
            DOM.loadingState.classList.add('hidden');
            
            if (timelineEvents.length === 0) {
                DOM.emptyState.classList.remove('hidden');
                setTimeout(() => DOM.emptyState.classList.remove('opacity-0'), 50);
                DOM.timelineContainer.classList.add('hidden');
                return;
            }

            DOM.emptyState.classList.add('hidden');
            DOM.timelineContainer.classList.remove('hidden');
            DOM.timelineContainer.innerHTML = '';

            let activeJob = null;
            let activePlace = null;
            const chronologicalData = [];

            // Process forward to track active status
            for (let y = START_YEAR; y <= CURRENT_YEAR; y++) {
                const yearEvents = timelineEvents.filter(e => parseInt(e.year) === y);
                
                const jobEvents = yearEvents.filter(e => e.category === 'Job');
                if (jobEvents.length > 0) activeJob = jobEvents[jobEvents.length - 1];

                const placeEvents = yearEvents.filter(e => e.category === 'Place Lived');
                if (placeEvents.length > 0) activePlace = placeEvents[placeEvents.length - 1];

                if (yearEvents.length > 0 || activeJob || activePlace) {
                    chronologicalData.push({ year: y, events: yearEvents, persistentJob: activeJob, persistentPlace: activePlace });
                }
            }

            // Render Reverse Chronological
            chronologicalData.reverse().forEach(block => {
                const yearBlock = document.createElement('div');
                yearBlock.className = 'relative pl-10 sm:pl-14';

                // Elegant Year marker
                const yearMarker = `
                    <div class="absolute -left-[27px] top-0 w-14 h-14 bg-[#fdfbf7] border-4 border-gray-200 rounded-full flex items-center justify-center z-10 shadow-sm">
                        <span class="font-serif font-bold text-gray-700 text-lg">${block.year}</span>
                    </div>
                `;

                // Smart Badges
                let badgesHTML = '';
                if (block.persistentPlace || block.persistentJob) {
                    badgesHTML += `<div class="flex flex-wrap gap-2 mb-5 pt-2">`;
                    if (block.persistentPlace) badgesHTML += `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-pastel-orange border border-pastel-orangeBorder text-pastel-orangeText text-xs font-semibold shadow-sm">${CAT_THEMES['Place Lived'].icon} Lived in: ${escapeHTML(block.persistentPlace.title)}</span>`;
                    if (block.persistentJob) badgesHTML += `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-pastel-purple border border-pastel-purpleBorder text-pastel-purpleText text-xs font-semibold shadow-sm">${CAT_THEMES['Job'].icon} Worked as: ${escapeHTML(block.persistentJob.title)}</span>`;
                    badgesHTML += `</div>`;
                }

                // Cards
                let eventsHTML = '<div class="space-y-6">';
                block.events.forEach(event => {
                    const theme = CAT_THEMES[event.category] || CAT_THEMES['Special Event'];
                    
                    let imageHTML = '';
                    if (event.category === 'Photo' && event.photoData) {
                        imageHTML = `<img src="${event.photoData}" class="w-full h-auto max-h-64 object-cover rounded-xl mb-4 border border-white/50 shadow-sm" alt="Timeline Photo">`;
                    }

                    eventsHTML += `
                        <div class="bg-white rounded-[1.5rem] p-5 shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <!-- Pastel decorative left border -->
                            <div class="absolute left-0 top-0 bottom-0 w-2 ${theme.bg}"></div>
                            
                            <div class="pl-3">
                                <div class="flex items-center gap-2 mb-3">
                                    <div class="p-1.5 rounded-xl ${theme.bg} ${theme.text} border ${theme.border}">${theme.icon}</div>
                                    <span class="text-xs font-bold uppercase tracking-widest text-gray-400">${event.category}</span>
                                </div>
                                ${imageHTML}
                                <h3 class="text-xl font-serif font-bold text-gray-900 mb-1.5 leading-snug">${escapeHTML(event.title)}</h3>
                                ${event.description ? `<p class="text-gray-600 text-sm leading-relaxed">${escapeHTML(event.description)}</p>` : ''}
                            </div>
                        </div>
                    `;
                });
                eventsHTML += '</div>';

                yearBlock.innerHTML = yearMarker + badgesHTML + eventsHTML;
                DOM.timelineContainer.appendChild(yearBlock);
            });
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let activeInputEl = null;
        let initialText = '';
        let activeMicBtn = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if (!activeInputEl) return;
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                activeInputEl.value = initialText + transcript;
            };

            recognition.onend = () => {
                if (activeMicBtn) activeMicBtn.classList.remove('recording-active');
                activeInputEl = null;
                activeMicBtn = null;
            };
        } else {
            console.warn("Speech recognition not supported in this browser.");
        }

        // Handle Mic Buttons Click
        document.querySelectorAll('.mic-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!recognition) return alert("Voice dictation is not supported on this browser.");
                
                const targetId = btn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                
                // If clicking same active button, stop it.
                if (activeMicBtn === btn) {
                    recognition.stop();
                    return;
                }

                // If another was active, stop it first
                if (activeMicBtn) {
                    recognition.stop();
                }

                activeInputEl = targetInput;
                activeMicBtn = btn;
                initialText = targetInput.value ? targetInput.value + ' ' : '';
                
                btn.classList.add('recording-active');
                try { recognition.start(); } catch(err) { console.error(err); }
            });
        });

        document.querySelectorAll('.polish-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                const targetId = btn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                const text = targetInput.value.trim();
                
                if (!text) return; // Nothing to polish

                // UI Feedback
                btn.classList.add('animate-pulse', 'text-indigo-600');
                DOM.aiStatus.classList.remove('hidden');

                try {
                    const payload = {
                        contents: [{
                            parts: [{ text: `Correct the spelling, grammar, and formatting of this dictated text. Make it read elegantly while keeping the original meaning. Do not add conversational filler, return ONLY the corrected text:\n\n"${text}"` }]
                        }],
                    };
                    
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error("Gemini API failed");
                    
                    const result = await response.json();
                    if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                        targetInput.value = result.candidates[0].content.parts[0].text.trim();
                    }
                } catch (err) {
                    console.error("Error polishing text:", err);
                } finally {
                    btn.classList.remove('animate-pulse', 'text-indigo-600');
                    DOM.aiStatus.classList.add('hidden');
                }
            });
        });

        DOM.openModalBtn.addEventListener('click', () => DOM.addModal.classList.remove('hidden'));
        
        DOM.closeModalBtn.addEventListener('click', () => {
            if(recognition && activeMicBtn) recognition.stop();
            DOM.addModal.classList.add('hidden');
        });

        DOM.addEventForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !db) return;

            DOM.submitBtn.disabled = true;
            DOM.submitBtn.innerHTML = '<div class="spinner border-t-white"></div> Saving...';

            const formData = new FormData(DOM.addEventForm);
            const category = formData.get('category');
            
            const eventData = {
                year: parseInt(formData.get('year')),
                category: category,
                title: formData.get('title').trim(),
                description: formData.get('description').trim(),
                createdAt: new Date().toISOString()
            };

            // Include Base64 photo data if category is Photo
            if (category === 'Photo' && currentPhotoBase64) {
                eventData.photoData = currentPhotoBase64;
            }

            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'timelineEvents'), eventData);
                
                // Reset Form
                DOM.addEventForm.reset();
                DOM.yearSelect.value = CURRENT_YEAR;
                DOM.photoGroup.classList.add('hidden');
                DOM.photoPreview.classList.add('hidden');
                currentPhotoBase64 = null;
                
                DOM.addModal.classList.add('hidden');
            } catch (err) {
                console.error("Error saving event:", err);
            } finally {
                DOM.submitBtn.disabled = false;
                DOM.submitBtn.textContent = 'Save to Timeline';
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }
    </script>
</body>
</html>
