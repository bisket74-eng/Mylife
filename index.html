<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Life Journal & Timeline</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      
      /* Category Accent Colors matching UI */
      --cat-lived: #10b981;
      --cat-job: #f59e0b;
      --cat-trips: #06b6d4;
      --cat-people: #3b82f6;
      --cat-events: #a855f7;
      --cat-photos: #f43f5e;
      --cat-memos: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 120px;
      min-height: 100vh;
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-titles h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-settings {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main Container */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Year Card */
    .year-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .year-header {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 1rem;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .year-header span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* Category Section */
    .category-section {
      margin-bottom: 1rem;
      border-left: 3px solid transparent;
      padding-left: 10px;
    }

    .cat-lived  { border-left-color: var(--cat-lived); }
    .cat-job    { border-left-color: var(--cat-job); }
    .cat-trips  { border-left-color: var(--cat-trips); }
    .cat-people { border-left-color: var(--cat-people); }
    .cat-events { border-left-color: var(--cat-events); }
    .cat-photos { border-left-color: var(--cat-photos); }
    .cat-memos  { border-left-color: var(--cat-memos); }

    .category-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-lived .category-title  { color: var(--cat-lived); }
    .cat-job .category-title    { color: var(--cat-job); }
    .cat-trips .category-title  { color: var(--cat-trips); }
    .cat-people .category-title { color: var(--cat-people); }
    .cat-events .category-title { color: var(--cat-events); }
    .cat-photos .category-title { color: var(--cat-photos); }
    .cat-memos .category-title  { color: var(--cat-memos); }

    .empty-placeholder {
      font-size: 0.85rem;
      color: #475569;
      padding: 2px 0;
    }

    /* Timeline Entry Box */
    .entry-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .entry-content {
      flex: 1;
    }

    .entry-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #f8fafc;
      margin-bottom: 2px;
    }

    .entry-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.35;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 2px;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    /* Fixed Bottom Input Dock */
    .dock-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      z-index: 200;
    }

    .dock-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-story {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 10px 16px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .input-story:focus {
      border-color: var(--accent-blue);
    }

    .btn-action {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-mic {
      background: #334155;
      color: #f8fafc;
    }

    .btn-mic.recording {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 1rem;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      padding: 1.5rem;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .field-group {
      margin-bottom: 1.25rem;
    }

    .field-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .field-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn-modal {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent-blue); color: #0f172a; font-weight: 600; }
    .btn-secondary { background: #334155; color: white; }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>Life Journal & Timeline</h1>
      <p>Born August 21, 1974</p>
    </div>
    <button class="btn-settings" onclick="openSettings()">⚙️ Settings & Vault</button>
  </header>

  <main class="container" id="timelineContainer">
    <!-- Dynamic Year Blocks Inserted Here -->
  </main>

  <!-- Bottom Input Dock -->
  <div class="dock-container">
    <div class="dock-inner">
      <button class="btn-action btn-mic" id="micBtn" onclick="toggleSpeech()" title="Dictate Story">🎙️</button>
      <input type="text" class="input-story" id="storyInput" placeholder="Tell a story or add an event..." onkeydown="if(event.key==='Enter') processStory()" />
      <button class="btn-action" onclick="processStory()" title="Add Event">➔</button>
    </div>
  </div>

  <!-- Settings & Vault Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-title">Settings & Vault</div>
      <div class="field-group">
        <label for="apiKeyInput">Gemini API Key (Optional for AI Parsing)</label>
        <input type="password" id="apiKeyInput" placeholder="AIZA..." />
      </div>
      <div class="modal-actions">
        <button class="btn-modal btn-secondary" onclick="exportData()">Export Data</button>
        <button class="btn-modal btn-secondary" onclick="closeSettings()">Cancel</button>
        <button class="btn-modal btn-primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const BIRTH_YEAR = 1974;
    const CURRENT_YEAR = 2026;

    // Default Timeline State from LocalStorage
    let timelineData = JSON.parse(localStorage.getItem('timelineData')) || {};
    let apiKey = localStorage.getItem('geminiApiKey') || '';

    // Initialize Timeline Display
    function initTimeline() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      for (let year = CURRENT_YEAR; year >= BIRTH_YEAR; year--) {
        const age = year - BIRTH_YEAR;
        const yearData = timelineData[year] || {};

        const card = document.createElement('div');
        card.className = 'year-card';
        card.innerHTML = `
          <div class="year-header">${year} <span>· Age ${age}</span></div>
          ${renderCategory('WHERE I LIVED', '🏡', 'cat-lived', yearData['WHERE I LIVED'], year)}
          ${renderCategory('WHAT JOB I HAD', '💼', 'cat-job', yearData['WHAT JOB I HAD'], year)}
          ${renderCategory('TRIPS I TOOK', '✈️', 'cat-trips', yearData['TRIPS I TOOK'], year)}
          ${renderCategory('IMPORTANT PEOPLE', '👥', 'cat-people', yearData['IMPORTANT PEOPLE'], year)}
          ${renderCategory('IMPORTANT EVENTS', '🎉', 'cat-events', yearData['IMPORTANT EVENTS'], year)}
          ${renderCategory('PHOTOS & MEDIA', '📸', 'cat-photos', yearData['PHOTOS & MEDIA'], year)}
          ${renderCategory('VOICE MEMOS', '🎙️', 'cat-memos', yearData['VOICE MEMOS'], year)}
        `;
        container.appendChild(card);
      }
    }

    function renderCategory(title, emoji, cssClass, entries, year) {
      let contentHtml = '<div class="empty-placeholder">—</div>';
      if (entries && entries.length > 0) {
        contentHtml = entries.map((entry, index) => `
          <div class="entry-card">
            <div class="entry-content">
              <div class="entry-title">${escapeHtml(entry.title)}</div>
              <div class="entry-desc">${escapeHtml(entry.description)}</div>
            </div>
            <button class="btn-delete" onclick="deleteEntry(${year}, '${title}', ${index})" title="Delete">🗑️</button>
          </div>
        `).join('');
      }

      return `
        <div class="category-section ${cssClass}">
          <div class="category-title"><span>${emoji}</span> ${title}</div>
          ${contentHtml}
        </div>
      `;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Process User Entry
    async function processStory() {
      const input = document.getElementById('storyInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.placeholder = 'Analyzing...';

      let parsedEvents = [];
      if (apiKey) {
        parsedEvents = await parseWithGemini(text);
      } else {
        parsedEvents = parseFallback(text);
      }

      parsedEvents.forEach(evt => {
        if (!timelineData[evt.year]) timelineData[evt.year] = {};
        if (!timelineData[evt.year][evt.category]) timelineData[evt.year][evt.category] = [];
        timelineData[evt.year][evt.category].push({
          title: evt.title,
          description: evt.description
        });
      });

      saveTimeline();
      initTimeline();
      input.placeholder = 'Tell a story or add an event...';
    }

    // AI Parser via Gemini API
    async function parseWithGemini(userText) {
      const systemPrompt = `
You are a life journal timeline parser. Parse the user's input into structured JSON events.

CATEGORY DISAMBIGUATION RULES (INTENT PRIORITY):
1. IMPORTANT EVENTS takes priority over location keywords if the statement describes a milestone, ceremony, life achievement, medical event, graduation, birth, or life change (e.g., "graduated high school in Reno Nevada", "got married in Reno"). Mentioning a city or state inside an event statement does NOT make it a "WHERE I LIVED" entry.
2. WHERE I LIVED is strictly reserved for statements explicitly about moving, residing, or living in a place over time (e.g., "Moved to Reno", "Lived in Seattle from 1990 to 1995").
3. WHAT JOB I HAD takes priority if the primary action is employment or working at a company.
4. TRIPS I TOOK takes priority if the action is a vacation, tour, or short visit.
5. IMPORTANT PEOPLE takes priority if the statement introduces family, partners, or friends.

Respond ONLY with valid JSON in this exact structure:
{
  "events": [
    {
      "year": YYYY,
      "category": "IMPORTANT EVENTS" | "WHERE I LIVED" | "WHAT JOB I HAD" | "TRIPS I TOOK" | "IMPORTANT PEOPLE",
      "title": "Short descriptive title",
      "description": "Full details"
    }
  ]
}
`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\nInput Text: "${userText}"` }] }]
          })
        });

        const data = await response.json();
        const rawResponse = data.candidates[0].content.parts[0].text;
        const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const parsed = JSON.parse(jsonMatch[0]);
          return parsed.events || [];
        }
      } catch (err) {
        console.error('Gemini API Error, using fallback parser:', err);
      }
      return parseFallback(userText);
    }

    // Client-side Rule Engine (Fallback Parser)
    function parseFallback(text) {
      const yearMatch = text.match(/\b(19\d\d|20\d\d)\b/);
      const year = yearMatch ? parseInt(yearMatch[1]) : CURRENT_YEAR;

      let category = 'IMPORTANT EVENTS';
      let title = 'Event';

      const lower = text.toLowerCase();

      // Rule Disambiguation Priority Checklist
      if (lower.includes('graduat') || lower.includes('married') || lower.includes('born') || lower.includes('had ') || lower.includes('degree')) {
        category = 'IMPORTANT EVENTS';
        title = lower.includes('graduat') ? 'High School Graduation' : 'Life Event';
      } else if (lower.includes('lived in') || lower.includes('moved to') || lower.includes('bought home')) {
        category = 'WHERE I LIVED';
        title = 'Place Lived';
      } else if (lower.includes('worked') || lower.includes('job') || lower.includes('hired') || lower.includes('clerk')) {
        category = 'WHAT JOB I HAD';
        title = 'Job';
      } else if (lower.includes('trip') || lower.includes('visited') || lower.includes('flew to') || lower.includes('vacation')) {
        category = 'TRIPS I TOOK';
        title = 'Trip';
      }

      return [{
        year: year,
        category: category,
        title: title,
        description: text
      }];
    }

    // Storage Management
    function saveTimeline() {
      localStorage.setItem('timelineData', JSON.stringify(timelineData));
    }

    function deleteEntry(year, category, index) {
      if (timelineData[year] && timelineData[year][category]) {
        timelineData[year][category].splice(index, 1);
        saveTimeline();
        initTimeline();
      }
    }

    // Voice Dictation Implementation
    let recognition;
    function toggleSpeech() {
      const micBtn = document.getElementById('micBtn');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert('Speech recognition is not supported in this browser.');
        return;
      }

      if (recognition && recognition.isStarted) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.isStarted = true;

      micBtn.classList.add('recording');

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('storyInput').value = transcript;
        micBtn.classList.remove('recording');
        recognition.isStarted = false;
      };

      recognition.onerror = recognition.onend = () => {
        micBtn.classList.remove('recording');
        if (recognition) recognition.isStarted = false;
      };

      recognition.start();
    }

    // Settings Modal
    function openSettings() {
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('geminiApiKey', apiKey);
      closeSettings();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(timelineData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `life-journal-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    // Startup
    initTimeline();
  </script>
</body>
</html>
