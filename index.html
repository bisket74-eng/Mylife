<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efe9e1">
<title>My Life Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#efe9e1; --card:#fbf8f4; --ink:#2e2723; --soft:#6f635a; --line:#cfc3b6;
  --accent:#6b3a4a; --ok:#4f6a2f; --bad:#a63d3d; --rec:#a63d3d;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
main{max-width:600px;margin:0 auto;padding:0 16px}
h1{font:700 2.3rem/1.1 var(--serif);margin:24px 0 16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:600 1.05rem var(--sans);height:52px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;padding:0 14px}
button.solid{background:var(--accent);color:#fff}
button.rec.on{background:var(--rec);border-color:var(--rec);color:#fff}
button:disabled{opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin:0 0 14px;display:grid;gap:12px}
.card h3{font:700 1.5rem/1.2 var(--serif);margin:0}
.lab{font-weight:600;color:var(--soft);font-size:.95rem;margin:0 0 4px;display:block}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
input{height:52px}
textarea{height:140px;padding:12px;resize:none;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin:0;min-height:1.4em;font-weight:600;color:var(--ok)}
.msg.err{color:var(--bad)}
.hint{margin:0;color:var(--soft);font-size:.92rem}
.prev{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.prev img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.bar{margin:28px 0 12px}
.bar h2{font:700 1.8rem/1 var(--serif);margin:0}
.tl{padding-left:22px;border-left:2px solid var(--line)}
.tl.none{border:0;padding:0}
.year{margin:0 0 24px}
.year>h3{font:700 2.1rem/1 var(--serif);margin:0 0 10px;position:relative;color:var(--accent)}
.year>h3 small{font:600 1rem var(--sans);color:var(--soft);margin-left:8px}
.year>h3::before{content:"";position:absolute;left:-30px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;display:grid;gap:4px}
.item .k{font-size:.88rem;font-weight:600;color:var(--soft)}
.item .t{font:700 1.25rem/1.25 var(--serif)}
.item .d{margin:0;color:var(--ink)}
.item img{display:block;width:100%;border-radius:8px;margin-top:4px}
.item.born{background:transparent;border-style:dashed;color:var(--soft)}
.acts{display:flex;gap:16px}
.acts button{height:40px;border:0;color:var(--soft);font-size:.92rem;padding:0}
.need{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.need span{font-weight:600}
.need button{height:52px}
.empty{color:var(--soft)}
.menu{display:grid;gap:10px;margin-top:20px;grid-template-columns:1fr 1fr 1fr}
.menu button{height:60px;font-size:.95rem}

#book{display:none}
@media print{
  body{background:#fff;color:#222;padding:0;font:12pt/1.55 Georgia,'Times New Roman',serif}
  main{display:none}
  #book{display:block}
  #book .cover{height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
  #book .cover h1{font:700 44pt/1.1 Georgia,serif;margin:0 0 12pt}
  #book .cover p{font-size:14pt;color:#555;margin:0}
  #book .yr{margin:0 0 26pt}
  #book h2{font:700 28pt/1 Georgia,serif;margin:0 0 12pt;padding-bottom:6pt;border-bottom:1pt solid #999;break-after:avoid;page-break-after:avoid}
  #book h2 small{font-size:12pt;color:#666;margin-left:8pt;font-weight:400}
  #book p{margin:0 0 6pt;break-inside:avoid;page-break-inside:avoid}
  #book .ph{display:inline-block;width:46%;margin:6pt 2% 10pt 0;vertical-align:top;break-inside:avoid;page-break-inside:avoid}
  #book .ph img{display:block;width:100%;max-height:8cm;object-fit:contain;border:1pt solid #bbb}
  #book .ph span{display:block;font-size:10pt;color:#555;margin-top:2pt}
}
</style>
</head>
<body>
<main>
  <h1>My Life Timeline</h1>

  <section class="card" aria-label="Tell me anything">
    <h3>Tell me anything</h3>
    <textarea id="text" aria-label="Your thoughts" placeholder="Talk or type, in any order. For example: I was born in 1976. I moved back to Vancouver, Washington when I was 20. I had Kristen in 1992."></textarea>
    <div class="two">
      <button type="button" class="rec" id="rec" aria-pressed="false">Speak</button>
      <button type="button" id="pic">Add a photo</button>
    </div>
    <button type="button" class="solid" id="go">Add to my timeline</button>
    <p class="msg" id="msg" role="status"></p>
  </section>
  <input id="pfile" type="file" accept="image/*" hidden>

  <section class="card" id="photoPanel" hidden aria-label="Photo details">
    <h3>Which year is this photo from?</h3>
    <div class="prev"><img id="pimg" alt="Photo you chose"><div>
      <label class="lab" for="pyear">Year</label>
      <input type="number" id="pyear" inputmode="numeric" placeholder="1992">
    </div></div>
    <div><label class="lab" for="pcap">Who or what is in it? (optional)</label><input type="text" id="pcap"></div>
    <div class="two">
      <button type="button" class="solid" id="psave">Add photo</button>
      <button type="button" id="pcancel">Cancel</button>
    </div>
    <p class="msg err" id="pmsg" role="status"></p>
  </section>

  <div id="needs"></div>

  <div class="bar"><h2>My timeline</h2></div>
  <div id="tl" class="tl"></div>

  <div class="menu">
    <button type="button" class="solid" id="book-btn">Print as book</button>
    <button type="button" id="exp">Save backup</button>
    <button type="button" id="imp">Restore backup</button>
    <input id="impFile" type="file" accept="application/json,.json" hidden>
  </div>

  <section class="card" id="settings" style="margin-top:20px" aria-label="Settings">
    <h3>Settings</h3>
    <div><label class="lab" for="birth">Year you were born</label><input type="number" id="birth" inputmode="numeric" placeholder="1976"></div>
    <div><label class="lab" for="key">Anthropic API key</label><input type="password" id="key" autocomplete="off" placeholder="sk-ant-..."></div>
    <p class="hint">The key is kept only on this phone and goes only to Anthropic. It is never saved in this web page or your GitHub repository.</p>
    <button type="button" class="solid" id="ssave">Save settings</button>
    <p class="msg" id="smsg" role="status"></p>
  </section>
</main>
<div id="book" aria-hidden="true"></div>

<script>
(function(){
  var MODEL='claude-sonnet-5-5';
  var KEY='lifeTL.v1', AKEY='lifeTL.key', OLD='lifeBook.v3';
  var $=function(id){return document.getElementById(id)};
  var NOW=new Date().getFullYear(), LOW=1850;
  var LABEL={person:'Person',place:'Place',job:'Job',trip:'Trip',family:'Family',milestone:'Milestone',other:'Note',photo:'Photo'};
  var data={birthYear:null,events:[]}, pending=null;
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function validYear(v){var n=parseInt(v,10);return n>=LOW&&n<=NOW?n:null}

  /* ---------- storage ---------- */
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
  function load(){
    try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.events))data=d}catch(e){}
    if(!localStorage.getItem(KEY)){
      try{ /* bring over entries from the earlier year-by-year version */
        var o=JSON.parse(localStorage.getItem(OLD)||'null');
        if(o)Object.keys(o).forEach(function(y){
          var s=o[y],map={friends:'person',places:'place',jobs:'job',trips:'trip',big:'milestone'};
          Object.keys(map).forEach(function(k){(s[k]||[]).forEach(function(t){data.events.push({id:uid(),year:+y,title:t,details:'',type:map[k],created:Date.now()})})});
          (s.photos||[]).forEach(function(p){data.events.push({id:uid(),year:+y,title:p.cap||'',details:'',type:'photo',img:p.img,created:Date.now()})});
        });
        if(data.events.length)persist();
      }catch(e){}
    }
  }
  function say(id,t,bad){var m=$(id);m.textContent=t;m.className='msg'+(bad?' err':'')}

  /* ---------- settings ---------- */
  $('ssave').onclick=function(){
    var b=$('birth').value.trim(),k=$('key').value.trim();
    if(b){var y=validYear(b);if(!y){say('smsg','Enter a four-digit birth year.',1);return}data.birthYear=y}
    if(k)try{localStorage.setItem(AKEY,k)}catch(e){}
    $('key').value='';if(!persist()){say('smsg','Could not save.',1);return}
    say('smsg','Saved.');render();
  };

  /* ---------- voice ---------- */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, recording=false, base='', finalText='';
  function setRec(on){recording=on;var b=$('rec');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.textContent=on?'Stop':'Speak'}
  function startRec(){
    if(!SR){say('msg','Speaking needs Chrome. You can type instead.',1);return}
    base=$('text').value.trim();finalText='';
    rec=new SR();rec.lang='en-US';rec.continuous=false;rec.interimResults=true;
    rec.onresult=function(ev){
      var interim='';
      for(var k=ev.resultIndex;k<ev.results.length;k++){var r=ev.results[k];if(r.isFinal)finalText+=(finalText?' ':'')+r[0].transcript.trim();else interim+=r[0].transcript}
      $('text').value=[base,finalText,interim.trim()].filter(Boolean).join(' ');
    };
    rec.onerror=function(ev){if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){say('msg','Microphone is blocked. Allow it in Chrome site settings.',1);setRec(false)}};
    rec.onend=function(){if(recording){base=$('text').value.trim();finalText='';try{rec.start()}catch(e){setRec(false)}}};
    try{rec.start();setRec(true);say('msg','')}catch(e){setRec(false)}
  }
  function stopRec(){recording=false;if(rec){try{rec.stop()}catch(e){}}setRec(false)}
  $('rec').onclick=function(){recording?stopRec():startRec()};

  /* ---------- the AI helper ---------- */
  function systemPrompt(){
    return 'You turn a person\'s scattered, spoken thoughts into entries for their personal life timeline. '+
    'The current year is '+NOW+'. Their birth year is '+(data.birthYear||'unknown')+'. '+
    'Pull out every distinct event, person, place, job, trip or fact they mention. '+
    'Rules: year is a four-digit number. If they give a year, use it. If they give an age and their birth year is known, year = birth year + age. '+
    'If the year cannot be worked out from what they said, use null. Never guess a year. '+
    'If they say what year they were born, return it as birth_year, and do not also list it as an event. '+
    'title: short and plain, for example "Moved back to Vancouver, Washington" or "Kristen was born". '+
    'details: other specifics they said, or an empty string. Do not add anything they did not say. '+
    'type is one of: person, place, job, trip, family, milestone, other. '+
    'Skip anything already in the timeline list you are given. '+
    'Return ONLY JSON, no other text: {"birth_year":null,"events":[{"year":1992,"title":"","details":"","type":"family"}]}';
  }
  function existing(){
    return data.events.filter(function(e){return e.type!=='photo'}).slice(-150).map(function(e){return '- '+(e.year||'no year')+': '+e.title}).join('\n')||'(empty)';
  }
  function ask(text){
    var key=localStorage.getItem(AKEY);
    if(!key)return Promise.reject(new Error('NOKEY'));
    return fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:2000,system:systemPrompt(),
        messages:[{role:'user',content:'Already in the timeline:\n'+existing()+'\n\nNew thoughts:\n"""\n'+text+'\n"""'}]})
    }).then(function(r){
      return r.json().then(function(j){
        if(!r.ok)throw new Error(r.status===401?'BADKEY':(j&&j.error&&j.error.message)||('Error '+r.status));
        return j;
      });
    });
  }
  function parse(j){
    var t=(j.content||[]).map(function(b){return b.type==='text'?b.text:''}).join('');
    var a=t.indexOf('{'),b=t.lastIndexOf('}');
    if(a<0||b<a)throw new Error('I could not read the answer. Please try again.');
    return JSON.parse(t.slice(a,b+1));
  }
  $('go').onclick=function(){
    if(recording)stopRec();
    var text=$('text').value.trim();
    if(!text){say('msg','Tell me something first.',1);return}
    if(!localStorage.getItem(AKEY)){say('msg','Add your Anthropic key in Settings at the bottom first.',1);$('settings').scrollIntoView({block:'center'});return}
    var go=$('go');go.disabled=true;say('msg','Reading your thoughts...');
    ask(text).then(function(j){
      var out=parse(j),n=0,u=0;
      var by=validYear(out.birth_year);if(by){data.birthYear=by}
      (out.events||[]).forEach(function(e){
        if(!e||!e.title)return;
        var y=validYear(e.year);
        data.events.push({id:uid(),year:y,title:String(e.title).trim(),details:String(e.details||'').trim(),type:LABEL[e.type]?e.type:'other',created:Date.now()});
        y?n++:u++;
      });
      if(!persist()){data.events.length-=(n+u);throw new Error('Storage is full. Save a backup first.')}
      $('text').value='';
      var m=[];if(by)m.push('birth year '+by+' saved');if(n)m.push(n+' added to your timeline');if(u)m.push(u+' need a year');
      say('msg',m.length?(m.join(', ')+'.').replace(/^./,function(c){return c.toUpperCase()}):'I did not find anything new to add.');
      render();
    }).catch(function(e){
      var m=e.message==='BADKEY'?'That API key was not accepted. Check it in Settings.':(e instanceof TypeError?'Could not reach the internet. Try again.':(e instanceof SyntaxError?'I could not read the answer. Please try again.':e.message));
      say('msg',m,1);
    }).then(function(){go.disabled=false});
  };

  /* ---------- photos ---------- */
  function shrink(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));
      };
      im.onerror=function(){cb(null)};im.src=r.result;
    };
    r.onerror=function(){cb(null)};r.readAsDataURL(file);
  }
  $('pic').onclick=function(){$('pfile').click()};
  $('pfile').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    shrink(f,function(d){
      if(!d){say('msg','Could not read that photo.',1);return}
      pending=d;$('pimg').src=d;$('pyear').value='';$('pcap').value='';say('pmsg','');
      $('photoPanel').hidden=false;$('photoPanel').scrollIntoView({block:'center'});
    });
  };
  $('pcancel').onclick=function(){pending=null;$('photoPanel').hidden=true};
  $('psave').onclick=function(){
    var y=validYear($('pyear').value);
    if(!y){say('pmsg','Enter the year, for example 1992.',1);return}
    data.events.push({id:uid(),year:y,title:$('pcap').value.trim(),details:'',type:'photo',img:pending,created:Date.now()});
    if(!persist()){data.events.pop();say('pmsg','Storage is full. Save a backup first.',1);return}
    pending=null;$('photoPanel').hidden=true;say('msg','Photo added to '+y+'.');render();
  };

  /* ---------- timeline ---------- */
  function el(tag,txt,cls){var e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
  function btn(txt,fn){var b=el('button',txt);b.type='button';b.onclick=fn;return b}
  function ageLabel(y){return data.birthYear&&y>=data.birthYear?(y===data.birthYear?'Born':'Age '+(y-data.birthYear)):''}
  function byYear(){
    var g={};
    data.events.forEach(function(e){if(e.year)(g[e.year]=g[e.year]||[]).push(e)});
    if(data.birthYear&&!g[data.birthYear])g[data.birthYear]=[];
    return Object.keys(g).map(Number).sort(function(a,b){return a-b}).map(function(y){
      return {year:y,list:g[y].sort(function(a,b){return a.created-b.created})};
    });
  }
  function itemLine(e){return e.type==='photo'?(e.title||'Photo'):e.title}
  function render(){
    if(data.birthYear&&document.activeElement!==$('birth'))$('birth').value=data.birthYear;
    /* events with no year */
    var nb=$('needs');nb.innerHTML='';
    var un=data.events.filter(function(e){return !e.year});
    if(un.length){
      var c=el('section',null,'card');c.appendChild(el('h3','These need a year'));
      c.appendChild(el('p','Type the year for each one and tap Place.','hint'));
      un.forEach(function(e){
        var row=el('div',null,'need'),inp=el('input');inp.type='number';inp.inputMode='numeric';inp.placeholder='Year';inp.setAttribute('aria-label','Year for '+e.title);
        row.appendChild(el('span',e.title));row.appendChild(inp);
        row.appendChild(btn('Place',function(){
          var y=validYear(inp.value);if(!y){inp.focus();return}
          e.year=y;persist();render();
        }));
        c.appendChild(row);
      });
      nb.appendChild(c);
    }
    /* timeline */
    var box=$('tl');box.innerHTML='';
    var groups=byYear();
    box.className='tl'+(groups.length?'':' none');
    if(!groups.length){box.appendChild(el('p','Nothing here yet. Tell me something above and it will land in order.','empty'));return}
    groups.forEach(function(g){
      var sec=el('section',null,'year'),h=el('h3',String(g.year)),a=ageLabel(g.year);
      if(a)h.appendChild(el('small',a));sec.appendChild(h);
      if(g.year===data.birthYear)sec.appendChild(el('div','You were born.','item born'));
      g.list.forEach(function(e){
        var d=el('div',null,'item');
        d.appendChild(el('span',LABEL[e.type]||'Note','k'));
        if(e.type==='photo'){var im=el('img');im.src=e.img;im.alt=e.title||'Photo from '+g.year;d.appendChild(im);if(e.title)d.appendChild(el('span',e.title,'t'))}
        else{d.appendChild(el('span',e.title,'t'));if(e.details)d.appendChild(el('p',e.details,'d'))}
        var acts=el('div',null,'acts');
        acts.appendChild(btn('Edit',function(){var v=prompt('Edit:',e.title);if(v===null)return;e.title=v.trim();persist();render()}));
        acts.appendChild(btn('Change year',function(){var v=prompt('Year:',e.year);if(v===null)return;var y=validYear(v);if(y){e.year=y;persist();render()}}));
        acts.appendChild(btn('Delete',function(){if(confirm('Delete this?')){data.events=data.events.filter(function(k){return k.id!==e.id});persist();render()}}));
        d.appendChild(acts);sec.appendChild(d);
      });
      box.appendChild(sec);
    });
  }

  /* ---------- print as book ---------- */
  $('book-btn').onclick=function(){
    var gs=byYear();if(!gs.length){alert('Add something to your timeline first.');return}
    var b=$('book');b.innerHTML='';
    var c=el('div',null,'cover');c.appendChild(el('h1','My Life'));c.appendChild(el('p',gs[0].year+' to '+gs[gs.length-1].year));b.appendChild(c);
    gs.forEach(function(g){
      var s=el('section',null,'yr'),h=el('h2',String(g.year)),a=ageLabel(g.year);
      if(a)h.appendChild(el('small',a));s.appendChild(h);
      if(g.year===data.birthYear)s.appendChild(el('p','I was born.'));
      g.list.forEach(function(e){
        if(e.type==='photo'){var w=el('div',null,'ph'),im=el('img');im.src=e.img;im.alt='';w.appendChild(im);if(e.title)w.appendChild(el('span',e.title));s.appendChild(w)}
        else s.appendChild(el('p',e.title+(e.details?'. '+e.details:'')));
      });
      b.appendChild(s);
    });
    setTimeout(function(){window.print()},300);
  };

  /* ---------- backup / restore (the API key is never included) ---------- */
  $('exp').onclick=function(){
    var blob=new Blob([JSON.stringify({app:'life-timeline',version:7,birthYear:data.birthYear,events:data.events})],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='my-life-timeline-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
  };
  $('imp').onclick=function(){$('impFile').click()};
  $('impFile').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result),have={},n=0;
        if(!Array.isArray(d.events))throw 0;
        data.events.forEach(function(e){have[e.id]=1});
        d.events.forEach(function(e){if(e&&e.id&&e.title!==undefined&&!have[e.id]){data.events.push(e);have[e.id]=1;n++}});
        if(!data.birthYear&&validYear(d.birthYear))data.birthYear=d.birthYear;
        if(!persist())throw 0;
        render();alert('Restored '+n+' item'+(n===1?'':'s')+'.');
      }catch(e){alert('That file could not be restored.')}
    };
    r.readAsText(f);
  };

  load();render();
  if(!localStorage.getItem(AKEY))say('smsg','Add your key here to turn on the helper.',1);
})();
</script>
</body>
</html>
