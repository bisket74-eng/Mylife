<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e6ded5">
<title>My Life Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#efe9e1; --card:#fbf8f4; --ink:#2e2723; --soft:#6f635a; --line:#cfc3b6;
  --accent:#6b3a4a; --ok:#4f6a2f; --bad:#a63d3d;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 40px)}
main{max-width:600px;margin:0 auto;padding:0 16px}
h1{font:700 2.3rem/1.1 var(--serif);margin:24px 0 16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:600 1.05rem var(--sans);height:52px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;padding:0 14px}
button.solid{background:var(--accent);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin:0 0 14px}
.lab{font-weight:600;color:var(--soft);font-size:.95rem;margin:0 0 6px;display:block}
.wheel{position:relative;height:176px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.wheel::before{content:"";position:absolute;left:8px;right:8px;top:66px;height:44px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);pointer-events:none;z-index:1}
#ylist{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:66px 0;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
#ylist::-webkit-scrollbar{display:none}
#ylist div{height:44px;text-align:center;font:600 1.5rem/44px var(--serif);color:var(--soft);scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer}
#ylist div.has::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
#ylist div.sel{color:var(--accent);font-size:1.9rem;font-weight:700}

.pagehead{margin:24px 0 4px}
.pagehead h2{font:700 2.8rem/1 var(--serif);color:var(--accent);margin:0}
.saved{min-height:1.4em;margin:0 0 8px;color:var(--ok);font-weight:600;font-size:.95rem}
.saved.err{color:var(--bad)}
.card h3{font:700 1.5rem/1.2 var(--serif);margin:0 0 10px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text]{width:100%;height:52px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.items{list-style:none;margin:10px 0 0;padding:0}
.items li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:2px 0 2px 2px}
.items li span{padding:8px 0}
.items button{height:44px;border:0;color:var(--soft);font-size:.92rem;padding:0 6px}
.none{color:var(--soft);margin:10px 0 0;font-size:.95rem}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}
.pic{display:grid;gap:6px}
.pic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pic input{height:44px;font-size:.95rem}
.pic button{height:38px;border:0;color:var(--soft);font-size:.9rem;padding:0}
.addpic{width:100%}
.menu{display:grid;gap:10px;margin-top:26px;grid-template-columns:1fr 1fr 1fr}
.menu button{height:64px;font-size:.98rem}

#book{display:none}
@media print{
  body{background:#fff;color:#222;padding:0;font:12pt/1.55 Georgia,'Times New Roman',serif}
  main{display:none}
  #book{display:block}
  #book .cover{height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
  #book .cover h1{font:700 44pt/1.1 Georgia,serif;margin:0 0 12pt}
  #book .cover p{font-size:14pt;color:#555;margin:0}
  #book .yr{margin:0 0 28pt}
  #book h2{font:700 30pt/1 Georgia,serif;margin:0 0 14pt;padding-bottom:6pt;border-bottom:1pt solid #999;break-after:avoid;page-break-after:avoid}
  #book p{margin:0 0 6pt;break-inside:avoid;page-break-inside:avoid}
  #book p b{color:#555}
  #book .ph{display:inline-block;width:46%;margin:6pt 2% 10pt 0;vertical-align:top;break-inside:avoid;page-break-inside:avoid}
  #book .ph img{display:block;width:100%;max-height:8cm;object-fit:contain;border:1pt solid #bbb}
  #book .ph span{display:block;font-size:10pt;color:#555;margin-top:2pt}
}
</style>
</head>
<body>
<main>
  <h1>My Life Book</h1>

  <section class="card" aria-label="Pick a year">
    <span class="lab" id="ylab">Pick a year</span>
    <div class="wheel"><div id="ylist" role="listbox" aria-labelledby="ylab" tabindex="0"></div></div>
  </section>

  <div class="pagehead"><h2 id="yearTitle"></h2></div>
  <p class="saved" id="saved" role="status"></p>
  <div id="page"></div>

  <div class="menu">
    <button type="button" class="solid" id="book-btn">Print as book</button>
    <button type="button" id="exp">Save backup</button>
    <button type="button" id="imp">Restore backup</button>
    <input id="impFile" type="file" accept="application/json,.json" hidden>
  </div>
</main>
<div id="book" aria-hidden="true"></div>

<script>
(function(){
  var KEY='lifeBook.v3', V2='lifeBook.v2', V1='lifeBook.v1', OLD='lifeTimeline.v1', YKEY='lifeBook.year';
  var $=function(id){return document.getElementById(id)};
  var MIN=1900, MAX=new Date().getFullYear(), H=44, year=1980, shown=null, years={};
  var FIELDS=[
    ['friends','Friends','Type a name'],
    ['places','Places I lived','Address or town'],
    ['jobs','Jobs','Where did you work?'],
    ['trips','Trips','Where did you go?'],
    ['big','Big things that happened','Wedding, birth, move, graduation']
  ];
  var ALT={friends:'people',jobs:'job'};
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function blank(){var d={photos:[]};FIELDS.forEach(function(f){d[f[0]]=[]});return d}
  function yr(y){return years[y]||(years[y]=blank())}
  function has(y){var d=years[y];return !!d&&(d.photos.length>0||FIELDS.some(function(f){return d[f[0]].length>0}))}
  function toList(v){
    if(Array.isArray(v))v=v.map(String);else if(typeof v==='string')v=v.split(/[,;\n]+/);else v=[];
    return v.map(function(s){return s.trim()}).filter(Boolean);
  }
  function uniq(a){var seen={};return a.filter(function(s){var k=s.toLowerCase();if(seen[k])return false;seen[k]=1;return true})}
  /* reads this version's year or an older one (halves, or single text boxes) */
  function norm(s){
    var d=blank();s=s||{};
    FIELDS.forEach(function(f){
      var k=f[0],o=ALT[k]||k;
      if(s.h1||s.h2)d[k]=uniq(toList(s.h1&&s.h1[o]).concat(toList(s.h2&&s.h2[o])));
      else d[k]=uniq(toList(s[k]!==undefined?s[k]:s[o]));
    });
    d.photos=Array.isArray(s.photos)?s.photos:[];
    return d;
  }

  /* ---------- storage ---------- */
  function load(){
    var raw=null,k;
    [KEY,V2,V1].forEach(function(n){if(!raw){try{raw=JSON.parse(localStorage.getItem(n)||'null')}catch(e){}}});
    if(!raw){
      try{
        var old=JSON.parse(localStorage.getItem(OLD)||'[]'),map={home:'places',person:'friends',trip:'trips',job:'jobs'};raw={};
        old.forEach(function(m){
          var d=raw[m.year]||(raw[m.year]=blank()),f=map[m.kind]||'big';
          var line=m.title||m.caption||m.text||'';if(line)d[f].push(line);
          if(m.img)d.photos.push({id:uid(),img:m.img,cap:m.title||m.caption||''});
        });
      }catch(e){raw={}}
    }
    years={};Object.keys(raw).forEach(function(y){years[y]=norm(raw[y])});
    if(!localStorage.getItem(KEY))persist();
    var y=parseInt(localStorage.getItem(YKEY),10);if(y>=MIN&&y<=MAX)year=y;
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(years));return true}catch(e){return false}}
  function flash(ok,msg){var s=$('saved');s.className='saved'+(ok?'':' err');s.textContent=ok?(msg||'Saved'):'Storage is full. Save a backup, then remove a picture.'}

  /* ---------- year wheel (every year from 1900) ---------- */
  var list=$('ylist'), selEl=null, wTimer=null;
  for(var y=MIN;y<=MAX;y++){var d=document.createElement('div');d.textContent=y;d.setAttribute('role','option');list.appendChild(d)}
  function dot(y){list.children[y-MIN].classList.toggle('has',!!has(y))}
  function dotsAll(){for(var k=MIN;k<=MAX;k++)dot(k)}
  function track(){
    var idx=Math.max(0,Math.min(MAX-MIN,Math.round(list.scrollTop/H))), e=list.children[idx];
    if(selEl!==e){if(selEl)selEl.classList.remove('sel');e.classList.add('sel');selEl=e}
    year=MIN+idx;
  }
  list.addEventListener('scroll',function(){
    track();clearTimeout(wTimer);
    wTimer=setTimeout(function(){try{localStorage.setItem(YKEY,year)}catch(e){}if(year!==shown)showYear()},150);
  });
  list.addEventListener('click',function(e){
    var i=Array.prototype.indexOf.call(list.children,e.target);
    if(i>-1)list.scrollTo({top:i*H,behavior:'smooth'});
  });

  /* ---------- the page for one year ---------- */
  function el(tag,txt,cls){var e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
  function btn(txt,fn,cls){var b=el('button',txt,cls);b.type='button';b.onclick=fn;return b}
  function showYear(){
    shown=year;$('yearTitle').textContent=year;$('saved').textContent='';
    var page=$('page');page.innerHTML='';
    FIELDS.forEach(function(f){
      var card=el('section',null,'card');card.appendChild(el('h3',f[1]));
      var row=el('div',null,'add'), inp=el('input');
      inp.type='text';inp.placeholder=f[2];inp.autocomplete='off';inp.setAttribute('enterkeyhint','done');inp.setAttribute('aria-label',f[1]);
      var holder=el('div');
      function paint(){
        holder.innerHTML='';
        var arr=yr(shown)[f[0]];
        if(!arr.length){holder.appendChild(el('p','Nothing added yet.','none'));return}
        var ul=el('ul',null,'items');
        arr.forEach(function(t,i){
          var li=el('li');li.appendChild(el('span',t));
          li.appendChild(btn('Remove',function(){arr.splice(i,1);flash(persist(),'Removed');dot(shown);paint()}));
          ul.appendChild(li);
        });
        holder.appendChild(ul);
      }
      function add(){
        var v=inp.value.trim();if(!v)return;
        v=v.charAt(0).toUpperCase()+v.slice(1);
        var arr=yr(shown)[f[0]];
        if(!arr.some(function(t){return t.toLowerCase()===v.toLowerCase()}))arr.push(v);
        if(!persist()){arr.pop();flash(false);return}
        inp.value='';flash(true,'Added to '+f[1]);dot(shown);paint();
      }
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add()}});
      row.appendChild(inp);row.appendChild(btn('Add',add,'solid'));
      card.appendChild(row);card.appendChild(holder);page.appendChild(card);paint();
    });
    var pc=el('section',null,'card');pc.appendChild(el('h3','Photos'));
    var grid=el('div',null,'pics');pc.appendChild(grid);
    pc.appendChild(btn('Add photos',function(){$('pfile').click()},'addpic solid'));
    page.appendChild(pc);
    drawPics(grid);
  }
  function drawPics(grid){
    grid=grid||document.querySelector('.pics');if(!grid)return;
    grid.innerHTML='';
    var d=yr(shown);
    if(!d.photos.length){grid.style.display='none';return}
    grid.style.display='';
    d.photos.forEach(function(p){
      var w=el('div',null,'pic'), im=el('img');im.src=p.img;im.alt=p.cap||'Photo from '+shown;
      var cap=el('input');cap.type='text';cap.placeholder='Who is this?';cap.value=p.cap||'';cap.setAttribute('aria-label','Caption');
      cap.addEventListener('input',function(){p.cap=cap.value;clearTimeout(cap._t);cap._t=setTimeout(function(){flash(persist())},500)});
      w.appendChild(im);w.appendChild(cap);
      w.appendChild(btn('Remove',function(){
        if(!confirm('Remove this photo?'))return;
        d.photos=d.photos.filter(function(k){return k.id!==p.id});
        flash(persist(),'Removed');dot(shown);drawPics(grid);
      }));
      grid.appendChild(w);
    });
  }

  /* ---------- photo picker ---------- */
  function shrink(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));
      };
      im.onerror=function(){cb(null)};im.src=r.result;
    };
    r.onerror=function(){cb(null)};r.readAsDataURL(file);
  }
  var pf=document.createElement('input');pf.type='file';pf.accept='image/*';pf.multiple=true;pf.hidden=true;document.body.appendChild(pf);
  pf.onchange=function(){
    var files=Array.prototype.slice.call(pf.files||[]), y0=shown;pf.value='';
    (function next(){
      var f=files.shift();if(!f){if(shown===y0)drawPics();return}
      shrink(f,function(data){
        if(data){
          var ph=yr(y0).photos;ph.push({id:uid(),img:data,cap:''});
          if(!persist()){ph.pop();flash(false)}else flash(true,'Photo added');
          dot(y0);
        }
        next();
      });
    })();
  };

  /* ---------- print as book ---------- */
  $('book-btn').onclick=function(){
    var ys=Object.keys(years).map(Number).filter(has).sort(function(a,b){return a-b});
    if(!ys.length){alert('Fill in at least one year first.');return}
    var b=$('book');b.innerHTML='';
    var c=el('div',null,'cover');c.appendChild(el('h1','My Life'));c.appendChild(el('p',ys[0]+' to '+ys[ys.length-1]));b.appendChild(c);
    ys.forEach(function(y){
      var d=years[y], s=el('section',null,'yr');s.appendChild(el('h2',y));
      FIELDS.forEach(function(f){
        if(!d[f[0]].length)return;
        var p=el('p'),bb=el('b',f[1]+': ');p.appendChild(bb);p.appendChild(document.createTextNode(d[f[0]].join(', ')));s.appendChild(p);
      });
      d.photos.forEach(function(p){
        var w=el('div',null,'ph'),im=el('img');im.src=p.img;im.alt='';w.appendChild(im);
        if(p.cap)w.appendChild(el('span',p.cap));s.appendChild(w);
      });
      b.appendChild(s);
    });
    setTimeout(function(){window.print()},300);
  };

  /* ---------- backup / restore ---------- */
  $('exp').onclick=function(){
    var blob=new Blob([JSON.stringify({app:'life-book',version:6,years:years})],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='my-life-book-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
  };
  $('imp').onclick=function(){$('impFile').click()};
  $('impFile').onchange=function(){
    var f=this.files[0];this.value='';if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var inc=JSON.parse(r.result).years;if(!inc)throw 0;
        Object.keys(inc).forEach(function(y){
          var s=norm(inc[y]),d=yr(y);
          FIELDS.forEach(function(fl){d[fl[0]]=uniq(d[fl[0]].concat(s[fl[0]]))});
          var have={};d.photos.forEach(function(p){have[p.id]=1});
          s.photos.forEach(function(p){if(p&&p.img&&!have[p.id])d.photos.push(p)});
        });
        if(!persist())throw 0;
        dotsAll();showYear();alert('Restored.');
      }catch(e){alert('That file could not be restored.')}
    };
    r.readAsText(f);
  };

  load();dotsAll();
  list.scrollTop=(year-MIN)*H;track();showYear();
})();
</script>
</body>
</html>
