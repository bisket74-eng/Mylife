
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Lifetime Line</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        pastel: {
                            bg: '#fcfbf7',
                            blue: '#e2f0d9', blueText: '#274e13',
                            green: '#e2efda', greenText: '#375623',
                            orange: '#fce4d6', orangeText: '#c65911',
                            purple: '#f2f0f9', purpleText: '#595959',
                            pink: '#f8cbad', pinkText: '#a61c1c',
                            cardBg: '#ffffff',
                            border: '#edebe4'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #fcfbf7; color: #2c2c2c; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .recording-active {
            animation: pulse-mic 1.5s infinite;
            background-color: #fee2e2 !important;
            color: #ef4444 !important;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-enter { animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media print {
            body { background: white !important; }
            header, button, .no-print { display: none !important; }
            .print-book-mode { box-shadow: none !important; border: none !important; padding: 0 !important; }
        }
    </style>
</head>

<body class="font-sans antialiased pb-32">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-[#fcfbf7]/95 backdrop-blur-md border-b border-gray-200/60 px-4 py-4 sm:px-8 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl sm:text-3xl font-serif font-bold text-gray-900 tracking-tight">Lifetime Line</h1>
                <p class="text-xs sm:text-sm font-medium text-gray-500 italic">Your personal history, beautifully told.</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="book-view-btn" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs sm:text-sm font-medium bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <span id="book-btn-text">Book View</span>
                </button>
                <button id="clear-data-btn" class="text-xs text-gray-400 hover:text-red-500 px-2 py-1 transition-colors" title="Reset Data">Reset</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto mt-8 sm:mt-12 px-4 sm:px-6 relative">
        <div id="empty-state" class="flex flex-col items-center justify-center mt-24 text-center hidden">
            <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mb-5 border border-amber-200 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            </div>
            <h2 class="text-2xl font-serif font-semibold text-gray-800 mb-2">Your timeline is ready</h2>
            <p class="text-gray-500 max-w-sm text-sm">Tap the floating plus button below to add your first job, trip, home, photo, or memory.</p>
        </div>

        <div id="timeline-container" class="relative border-l-2 border-amber-900/10 ml-3 sm:ml-6 space-y-12 pb-16">
            <!-- Timeline items rendered dynamically -->
        </div>
    </main>

    <!-- Floating Action Button -->
    <button id="open-modal-btn" class="no-print fixed bottom-8 right-8 w-16 h-16 bg-gradient-to-tr from-amber-700 to-amber-600 hover:from-amber-800 hover:to-amber-700 text-white rounded-full shadow-2xl flex items-center justify-center transition-transform hover:scale-105 active:scale-95 z-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>

    <!-- Add / Edit Modal -->
    <div id="add-modal" class="no-print fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-lg rounded-t-[2rem] sm:rounded-3xl shadow-2xl overflow-hidden modal-enter flex flex-col max-h-[92vh]">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/80">
                <h2 id="modal-title" class="text-xl font-serif font-bold text-gray-900">Add Lifetime Event</h2>
                <button id="close-modal-btn" class="p-2 rounded-full hover:bg-gray-200 text-gray-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"></line><line x1="6" x2="18" y1="6" y2="18"></line></svg>
                </button>
            </div>
            
            <form id="add-event-form" class="p-6 space-y-5 overflow-y-auto no-scrollbar flex-1">
                <input type="hidden" id="edit-event-id" value="">
                
                <div class="flex gap-4">
                    <div class="w-1/3">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Year</label>
                        <select id="year-select" name="year" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-3 text-gray-900 font-semibold focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none transition-all" required></select>
                    </div>
                    <div class="w-2/3">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Category</label>
                        <select id="category-select" name="category" class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-3 text-gray-900 font-semibold focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none transition-all" required>
                            <option value="Photo">Photo</option>
                            <option value="Trip">Trip</option>
                            <option value="Place Lived">Place Lived</option>
                            <option value="Job">Job</option>
                            <option value="Special Event">Special Event</option>
                        </select>
                    </div>
                </div>

                <!-- Photo Upload Field -->
                <div id="photo-upload-group" class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Photo</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="event-photo-input" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500 px-4 text-center">
                                <svg class="w-7 h-7 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <p class="text-xs font-medium"><span class="font-semibold text-gray-700">Tap to upload photo</span> or select from device</p>
                            </div>
                            <input id="event-photo-input" type="file" accept="image/*" class="hidden" />
                        </label>
                    </div>
                    <img id="photo-preview" class="hidden w-full h-44 object-cover rounded-xl mt-3 border border-gray-200 shadow-sm" alt="Preview">
                </div>

                <!-- Title Input with Mic & AI Polish -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Title / Headline</label>
                        <span class="text-[11px] text-gray-400 italic">Voice or type</span>
                    </div>
                    <div class="relative">
                        <input type="text" id="input-title" name="title" placeholder="e.g., Software Engineer at TechCorp" class="w-full rounded-xl border border-gray-200 bg-gray-50 pl-3 pr-24 py-3 text-gray-900 focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none transition-all" required />
                        <div class="absolute right-2 top-2 flex gap-1">
                            <button type="button" class="mic-btn p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" data-target="input-title" title="Voice Dictation">
                                <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                            <button type="button" class="polish-btn p-2 text-gray-400 hover:text-amber-700 hover:bg-amber-50 rounded-lg transition-colors" data-target="input-title" title="Correct Grammar with AI">
                                <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Description / Voice Note Input -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Details & Memories</label>
                        <span class="text-[11px] text-gray-400 italic">Record voice notes</span>
                    </div>
                    <div class="relative">
                        <textarea id="input-desc" name="description" rows="3" placeholder="Tell the story of this memory..." class="w-full rounded-xl border border-gray-200 bg-gray-50 pl-3 pr-24 py-3 text-gray-900 focus:ring-2 focus:ring-amber-200 focus:border-amber-500 outline-none transition-all resize-none"></textarea>
                        <div class="absolute right-2 top-2 flex flex-col gap-1">
                            <button type="button" class="mic-btn p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" data-target="input-desc" title="Voice Dictation">
                                <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                            <button type="button" class="polish-btn p-2 text-gray-400 hover:text-amber-700 hover:bg-amber-50 rounded-lg transition-colors" data-target="input-desc" title="Correct Grammar with AI">
                                <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="ai-status" class="text-xs font-medium text-amber-700 hidden flex items-center gap-2 bg-amber-50 p-2.5 rounded-lg border border-amber-200">
                    <div class="spinner border-t-amber-700"></div>
                    Polishing grammar with AI...
                </div>

                <div class="pt-3 border-t border-gray-100 flex gap-3">
                    <button type="button" id="delete-event-btn" class="hidden px-4 py-3.5 bg-red-50 text-red-600 hover:bg-red-100 font-semibold rounded-xl transition-colors">Delete</button>
                    <button type="submit" id="submit-btn" class="flex-1 bg-gray-900 hover:bg-black text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-gray-200 transition-all active:scale-[0.98]">
                        Save to Timeline
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const START_YEAR = 1970;
        const CURRENT_YEAR = new Date().getFullYear();
        const STORAGE_KEY = 'lifetime_line_events_v2';

        const SAMPLE_EVENTS = [
            { id: 'sample-1', year: 1995, category: 'Place Lived', title: 'Moved to San Francisco, CA', description: 'Started a brand new chapter on the West Coast with two suitcases.', createdAt: new Date().toISOString() },
            { id: 'sample-2', year: 1998, category: 'Job', title: 'Senior Software Developer at Innovate Inc.', description: 'Led the core engineering team building web applications.', createdAt: new Date().toISOString() },
            { id: 'sample-3', year: 2005, category: 'Trip', title: 'Trip to Kyoto, Japan', description: 'Explored ancient temples, bamboo forests, and traditional tea houses during cherry blossom season.', createdAt: new Date().toISOString() },
            { id: 'sample-4', year: 2012, category: 'Special Event', title: 'Married Sarah in Napa Valley', description: 'An unforgettable outdoor ceremony surrounded by close family and friends.', createdAt: new Date().toISOString() }
        ];

        let timelineEvents = [];
        let currentPhotoBase64 = null;
        let isBookMode = false;

        const CAT_CONFIG = {
            'Photo': { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-800', icon: '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' },
            'Trip': { bg: 'bg-sky-50', border: 'border-sky-200', text: 'text-sky-800', icon: '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>' },
            'Place Lived': { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800', icon: '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>' },
            'Job': { bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-800', icon: '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>' },
            'Special Event': { bg: 'bg-pink-50', border: 'border-pink-200', text: 'text-pink-800', icon: '<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' }
        };

        // DOM Elements
        const DOM = {
            yearSelect: document.getElementById('year-select'),
            catSelect: document.getElementById('category-select'),
            photoGroup: document.getElementById('photo-upload-group'),
            photoInput: document.getElementById('event-photo-input'),
            photoPreview: document.getElementById('photo-preview'),
            timelineContainer: document.getElementById('timeline-container'),
            emptyState: document.getElementById('empty-state'),
            addModal: document.getElementById('add-modal'),
            openModalBtn: document.getElementById('open-modal-btn'),
            closeModalBtn: document.getElementById('close-modal-btn'),
            addEventForm: document.getElementById('add-event-form'),
            aiStatus: document.getElementById('ai-status'),
            submitBtn: document.getElementById('submit-btn'),
            modalTitle: document.getElementById('modal-title'),
            editEventId: document.getElementById('edit-event-id'),
            deleteEventBtn: document.getElementById('delete-event-btn'),
            bookViewBtn: document.getElementById('book-view-btn'),
            bookBtnText: document.getElementById('book-btn-text'),
            clearDataBtn: document.getElementById('clear-data-btn')
        };

        // Initialize Year Select options
        for (let y = CURRENT_YEAR; y >= START_YEAR; y--) {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            DOM.yearSelect.appendChild(opt);
        }

        // Load data from localStorage
        function loadEvents() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    timelineEvents = JSON.parse(data);
                } else {
                    timelineEvents = SAMPLE_EVENTS;
                    saveEvents();
                }
            } catch (e) {
                console.error("Storage read error:", e);
                timelineEvents = SAMPLE_EVENTS;
            }
            renderTimeline();
        }

        function saveEvents() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(timelineEvents));
            } catch (e) {
                console.error("Storage write error (maybe photo too large):", e);
                alert("Storage error: The photo file might be too large. Try a smaller image.");
            }
        }

        // Category change listener
        DOM.catSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Photo') {
                DOM.photoGroup.classList.remove('hidden');
            } else {
                DOM.photoGroup.classList.add('hidden');
                DOM.photoInput.value = '';
                DOM.photoPreview.classList.add('hidden');
                currentPhotoBase64 = null;
            }
        });

        // Photo file reader & compressor
        DOM.photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const MAX = 900;
                    let w = img.width, h = img.height;
                    if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
                    else if (h > MAX) { w *= MAX / h; h = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.82);
                    DOM.photoPreview.src = currentPhotoBase64;
                    DOM.photoPreview.classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Render Timeline with smart continuity
        function renderTimeline() {
            DOM.timelineContainer.innerHTML = '';
            
            if (timelineEvents.length === 0) {
                DOM.emptyState.classList.remove('hidden');
                return;
            }
            DOM.emptyState.classList.add('hidden');

            let activeJob = null;
            let activePlace = null;
            const chronologicalData = [];

            // Compute continuity year by year from START_YEAR to CURRENT_YEAR
            for (let y = START_YEAR; y <= CURRENT_YEAR; y++) {
                const yearEvents = timelineEvents.filter(e => parseInt(e.year) === y);
                
                const jobEvents = yearEvents.filter(e => e.category === 'Job');
                if (jobEvents.length > 0) activeJob = jobEvents[jobEvents.length - 1];

                const placeEvents = yearEvents.filter(e => e.category === 'Place Lived');
                if (placeEvents.length > 0) activePlace = placeEvents[placeEvents.length - 1];

                if (yearEvents.length > 0 || activeJob || activePlace) {
                    chronologicalData.push({
                        year: y,
                        events: yearEvents,
                        persistentJob: activeJob,
                        persistentPlace: activePlace
                    });
                }
            }

            // Reverse chronological order (newest on top)
            chronologicalData.reverse().forEach(block => {
                const yearDiv = document.createElement('div');
                yearDiv.className = 'relative pl-8 sm:pl-14';

                // Year marker bubble
                let yearHtml = `
                    <div class="absolute -left-[23px] sm:-left-[27px] top-0 w-12 h-12 sm:w-14 sm:h-14 bg-white border-4 border-amber-900/10 rounded-full flex items-center justify-center z-10 shadow-sm">
                        <span class="font-serif font-bold text-gray-800 text-base sm:text-lg">${block.year}</span>
                    </div>
                `;

                // Smart continuity badges
                let badgesHtml = '';
                if (block.persistentPlace || block.persistentJob) {
                    badgesHtml += '<div class="flex flex-wrap gap-2 mb-4 pt-1">';
                    if (block.persistentPlace) {
                        badgesHtml += `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-orange-50 text-orange-800 border border-orange-200 text-xs font-semibold shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                            Home: ${escapeHTML(block.persistentPlace.title)}
                        </span>`;
                    }
                    if (block.persistentJob) {
                        badgesHtml += `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-50 text-purple-800 border border-purple-200 text-xs font-semibold shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            Role: ${escapeHTML(block.persistentJob.title)}
                        </span>`;
                    }
                    badgesHtml += '</div>';
                }

                // Event cards
                let cardsHtml = '<div class="space-y-4">';
                block.events.forEach(ev => {
                    const theme = CAT_CONFIG[ev.category] || CAT_CONFIG['Special Event'];
                    let imgTag = ev.photoData ? `<img src="${ev.photoData}" class="w-full h-auto max-h-72 object-cover rounded-xl mb-4 border border-gray-100 shadow-sm" alt="Event photo">` : '';
                    
                    cardsHtml += `
                        <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-gray-200/80 relative hover:shadow-md transition-all group cursor-pointer event-card" data-id="${ev.id}">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-2">
                                    <div class="p-1.5 rounded-xl ${theme.bg} ${theme.text} border ${theme.border}">${theme.icon}</div>
                                    <span class="text-xs font-bold uppercase tracking-widest text-gray-400">${ev.category}</span>
                                </div>
                                <span class="text-xs text-gray-300 group-hover:text-gray-500 transition-colors">Edit</span>
                            </div>
                            ${imgTag}
                            <h3 class="text-lg sm:text-xl font-serif font-bold text-gray-900 mb-1.5 leading-snug">${escapeHTML(ev.title)}</h3>
                            ${ev.description ? `<p class="text-gray-600 text-sm leading-relaxed">${escapeHTML(ev.description)}</p>` : ''}
                        </div>
                    `;
                });
                cardsHtml += '</div>';

                yearDiv.innerHTML = yearHtml + badgesHtml + cardsHtml;
                DOM.timelineContainer.appendChild(yearDiv);
            });

            // Bind click events to edit cards
            document.querySelectorAll('.event-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.getAttribute('data-id');
                    openEditModal(id);
                });
            });
        }

        // Voice Dictation setup using Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let activeInput = null;
        let activeMicButton = null;
        let originalInputValue = '';

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (e) => {
                if (!activeInput) return;
                let transcript = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    transcript += e.results[i][0].transcript;
                }
                activeInput.value = originalInputValue + (originalInputValue ? ' ' : '') + transcript;
            };

            recognition.onend = () => {
                if (activeMicButton) activeMicButton.classList.remove('recording-active');
                activeInput = null;
                activeMicButton = null;
            };
        }

        document.querySelectorAll('.mic-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!recognition) {
                    alert("Voice dictation is not supported in this browser. Please use Chrome or Safari.");
                    return;
                }
                const targetId = btn.getAttribute('data-target');
                const targetEl = document.getElementById(targetId);

                if (activeMicButton === btn) {
                    recognition.stop();
                    return;
                }
                if (activeMicButton) recognition.stop();

                activeInput = targetEl;
                activeMicButton = btn;
                originalInputValue = targetEl.value.trim();
                btn.classList.add('recording-active');
                try { recognition.start(); } catch(err) { console.error(err); }
            });
        });

        // Gemini AI Grammar & Spelling Polish
        document.querySelectorAll('.polish-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                const targetId = btn.getAttribute('data-target');
                const targetEl = document.getElementById(targetId);
                const text = targetEl.value.trim();
                if (!text) return;

                btn.classList.add('animate-pulse', 'text-amber-700');
                DOM.aiStatus.classList.remove('hidden');

                try {
                    const payload = {
                        contents: [{
                            parts: [{ text: `Correct spelling, grammar, and punctuation for this lifetime memoir note. Return ONLY the polished text without any introduction or formatting:\n\n"${text}"` }]
                        }]
                    };
                    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error("API request failed");
                    const data = await res.json();
                    const polished = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                    if (polished) targetEl.value = polished;
                } catch (err) {
                    console.error("Gemini polish error:", err);
                    alert("Could not reach AI assistant. Check your internet connection.");
                } finally {
                    btn.classList.remove('animate-pulse', 'text-amber-700');
                    DOM.aiStatus.classList.add('hidden');
                }
            });
        });

        // Modal Controls
        function openAddModal() {
            DOM.editEventId.value = '';
            DOM.modalTitle.textContent = "Add Lifetime Event";
            DOM.addEventForm.reset();
            DOM.yearSelect.value = CURRENT_YEAR;
            DOM.photoGroup.classList.add('hidden');
            DOM.photoPreview.classList.add('hidden');
            currentPhotoBase64 = null;
            DOM.deleteEventBtn.classList.add('hidden');
            DOM.addModal.classList.remove('hidden');
        }

        function openEditModal(id) {
            const ev = timelineEvents.find(item => item.id === id);
            if (!ev) return;

            DOM.editEventId.value = ev.id;
            DOM.modalTitle.textContent = "Edit Lifetime Event";
            document.getElementById('year-select').value = ev.year;
            document.getElementById('category-select').value = ev.category;
            document.getElementById('input-title').value = ev.title || '';
            document.getElementById('input-desc').value = ev.description || '';
            
            if (ev.category === 'Photo' && ev.photoData) {
                currentPhotoBase64 = ev.photoData;
                DOM.photoPreview.src = ev.photoData;
                DOM.photoPreview.classList.remove('hidden');
                DOM.photoGroup.classList.remove('hidden');
            } else {
                DOM.photoGroup.classList.add('hidden');
                currentPhotoBase64 = null;
            }

            DOM.deleteEventBtn.classList.remove('hidden');
            DOM.addModal.classList.remove('hidden');
        }

        DOM.openModalBtn.addEventListener('click', openAddModal);
        DOM.closeModalBtn.addEventListener('click', () => {
            if (recognition && activeMicButton) recognition.stop();
            DOM.addModal.classList.add('hidden');
        });

        // Form Submit (Add or Edit)
        DOM.addEventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (recognition && activeMicButton) recognition.stop();

            const editId = DOM.editEventId.value;
            const category = document.getElementById('category-select').value;
            const eventObj = {
                id: editId || 'ev_' + Date.now() + Math.random().toString(36).substr(2, 5),
                year: parseInt(document.getElementById('year-select').value),
                category: category,
                title: document.getElementById('input-title').value.trim(),
                description: document.getElementById('input-desc').value.trim(),
                createdAt: new Date().toISOString()
            };

            if (category === 'Photo' && currentPhotoBase64) {
                eventObj.photoData = currentPhotoBase64;
            }

            if (editId) {
                const idx = timelineEvents.findIndex(item => item.id === editId);
                if (idx !== -1) {
                    if (!eventObj.photoData && timelineEvents[idx].photoData) {
                        eventObj.photoData = timelineEvents[idx].photoData; // retain photo if not changed
                    }
                    timelineEvents[idx] = eventObj;
                }
            } else {
                timelineEvents.push(eventObj);
            }

            saveEvents();
            renderTimeline();
            DOM.addModal.classList.add('hidden');
        });

        // Delete Event
        DOM.deleteEventBtn.addEventListener('click', () => {
            const editId = DOM.editEventId.value;
            if (!editId) return;
            if (confirm("Are you sure you want to delete this memory?")) {
                timelineEvents = timelineEvents.filter(item => item.id !== editId);
                saveEvents();
                renderTimeline();
                DOM.addModal.classList.add('hidden');
            }
        });

        // Book View / Print mode toggle
        DOM.bookViewBtn.addEventListener('click', () => {
            isBookMode = !isBookMode;
            const container = document.body;
            if (isBookMode) {
                container.classList.add('print-book-mode');
                DOM.bookBtnText.textContent = "Exit Book View";
                window.print();
            } else {
                container.classList.remove('print-book-mode');
                DOM.bookBtnText.textContent = "Book View";
            }
        });

        DOM.clearDataBtn.addEventListener('click', () => {
            if (confirm("Reset all timeline events to defaults?")) {
                localStorage.removeItem(STORAGE_KEY);
                loadEvents();
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }

        // Initial Load
        loadEvents();
    </script>
</body>
</html>
