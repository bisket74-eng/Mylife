<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Journal & Timeline</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-primary: #38bdf8;
      --accent-hover: #0284c7;
      --accent-subtle: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-photo: #f43f5e;
      --badge-place: #10b981;
      --badge-job: #f59e0b;
      --badge-trip: #06b6d4;
      --badge-event: #8b5cf6;
      --badge-person: #ec4899;
      --badge-pet: #84cc16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--accent-primary);
      color: #0f172a;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #0f172a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* Year Navigation Ribbon */
    .year-ribbon-container {
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 0;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
      position: sticky;
      top: 57px;
      z-index: 40;
      backdrop-filter: blur(8px);
    }

    .year-ribbon {
      display: flex;
      gap: 8px;
      padding: 0 16px;
    }

    .year-chip {
      padding: 6px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid transparent;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 64px;
    }

    .year-chip .sub-age {
      font-size: 0.65rem;
      opacity: 0.7;
      font-weight: 400;
    }

    .year-chip.active, .year-chip:hover {
      background: var(--accent-primary);
      color: #0f172a;
      border-color: var(--accent-primary);
    }

    .year-chip.active .sub-age, .year-chip:hover .sub-age {
      opacity: 0.9;
    }

    /* Main Content Container */
    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 100px;
      flex: 1;
    }

    /* Input Card Container */
    .input-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .input-header h2 {
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .voice-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: none;
    }

    .voice-btn.recording {
      animation: pulse 1.5s infinite;
      background: #dc2626;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select, textarea {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-primary);
    }

    .year-calc-badge {
      font-size: 0.75rem;
      color: var(--accent-primary);
      margin-top: 2px;
    }

    /* Timeline Cards */
    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent-primary), rgba(255, 255, 255, 0.05));
    }

    .year-section {
      margin-bottom: 32px;
      position: relative;
    }

    .year-heading {
      position: sticky;
      top: 105px;
      z-index: 10;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      background: var(--bg-color);
      padding: 4px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      margin-left: -20px;
      margin-bottom: 16px;
    }

    .year-heading h3 {
      font-size: 1.2rem;
      color: var(--accent-primary);
    }

    .year-heading span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .memory-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .memory-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .category-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
    }

    .tag-photo { background: var(--badge-photo); }
    .tag-place { background: var(--badge-place); }
    .tag-job { background: var(--badge-job); }
    .tag-trip { background: var(--badge-trip); }
    .tag-event { background: var(--badge-event); }
    .tag-person { background: var(--badge-person); }
    .tag-pet { background: var(--badge-pet); }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      color: #ef4444;
    }

    .memory-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .memory-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .memory-img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--card-border);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    /* Modal / Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Life Timeline Journal</div>
    <div class="header-actions">
      <button class="btn" id="exportBtn">Export JSON</button>
      <button class="btn" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" class="hidden" accept=".json" />
    </div>
  </header>

  <!-- Horizontal Scrollable Year Ribbon -->
  <div class="year-ribbon-container">
    <div class="year-ribbon" id="yearRibbon"></div>
  </div>

  <main>
    <!-- Simple Input Panel -->
    <div class="input-panel">
      <div class="input-header">
        <h2>Add Memory</h2>
        <button class="voice-btn" id="voiceBtn">
          <span>🎙️ Voice Input</span>
        </button>
      </div>

      <form id="memoryForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="photo">📸 Photo & Person</option>
              <option value="place">🏡 Place Lived</option>
              <option value="job">💼 Job / Career</option>
              <option value="trip">✈️ Trip / Travel</option>
              <option value="event">🎉 Important Event</option>
              <option value="person">👥 Important Person / Friend</option>
              <option value="pet">🐾 Pet</option>
            </select>
          </div>

          <div class="form-group">
            <label for="yearInput">Year / Age Picker</label>
            <select id="yearInput" required></select>
            <div class="year-calc-badge" id="yearAgeCalc">Age: 0</div>
          </div>

          <div class="form-group full-width" id="photoGroup">
            <label for="photoFile">Upload Photo</label>
            <input type="file" id="photoFile" accept="image/*" />
          </div>

          <div class="form-group full-width">
            <label for="titleInput" id="titleLabel">Title / Name</label>
            <input type="text" id="titleInput" placeholder="e.g., Moved to Vancouver, Started USPS, Pet name..." required />
          </div>

          <div class="form-group full-width">
            <label for="detailsInput">Memory / Details</label>
            <textarea id="detailsInput" rows="3" placeholder="Talk or write about this memory..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem;">
          ➕ Save to Timeline
        </button>
      </form>
    </div>

    <!-- Timeline Journal View -->
    <div id="timelineContainer" class="timeline"></div>
  </main>

  <script>
    // User Anchor Configuration
    const BIRTH_YEAR = 1974;
    const BIRTH_MONTH = 7; // August (0-indexed: 7)
    const CURRENT_YEAR = new Date().getFullYear();

    // Data Store
    let memories = JSON.parse(localStorage.getItem('life_journal_memories') || '[]');

    // DOM Elements
    const yearRibbon = document.getElementById('yearRibbon');
    const yearSelect = document.getElementById('yearInput');
    const yearAgeCalc = document.getElementById('yearAgeCalc');
    const categorySelect = document.getElementById('category');
    const photoGroup = document.getElementById('photoGroup');
    const titleLabel = document.getElementById('titleLabel');
    const memoryForm = document.getElementById('memoryForm');
    const timelineContainer = document.getElementById('timelineContainer');
    const voiceBtn = document.getElementById('voiceBtn');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');

    // Populate Year Ribbon & Select Options
    function initYearPickers() {
      yearRibbon.innerHTML = '';
      yearSelect.innerHTML = '';

      for (let yr = BIRTH_YEAR; yr <= CURRENT_YEAR; yr++) {
        const age = yr - BIRTH_YEAR;

        // Populate Select
        const option = document.createElement('option');
        option.value = yr;
        option.textContent = `${yr} (Age ${age})`;
        if (yr === CURRENT_YEAR) option.selected = true;
        yearSelect.appendChild(option);

        // Populate Ribbon Chip
        const chip = document.createElement('div');
        chip.className = `year-chip ${yr === CURRENT_YEAR ? 'active' : ''}`;
        chip.dataset.year = yr;
        chip.innerHTML = `<span>${yr}</span><span class="sub-age">Age ${age}</span>`;
        chip.addEventListener('click', () => {
          document.querySelectorAll('.year-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          scrollToYear(yr);
        });
        yearRibbon.appendChild(chip);
      }
      updateAgeDisplay();
    }

    function scrollToYear(year) {
      const el = document.getElementById(`year-section-${year}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        // If year section doesn't exist yet, scroll to timeline top
        timelineContainer.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function updateAgeDisplay() {
      const selectedYear = parseInt(yearSelect.value);
      const age = selectedYear - BIRTH_YEAR;
      yearAgeCalc.textContent = `Year ${selectedYear} • Age approximately ${age}`;
    }

    yearSelect.addEventListener('change', updateAgeDisplay);

    // Dynamic Category Fields Adjustments
    categorySelect.addEventListener('change', () => {
      const cat = categorySelect.value;
      if (cat === 'photo') {
        photoGroup.classList.remove('hidden');
        titleLabel.textContent = 'Person / Subject Name';
      } else {
        photoGroup.classList.add('hidden');
        if (cat === 'place') titleLabel.textContent = 'Location / City / Address';
        else if (cat === 'job') titleLabel.textContent = 'Job Title / Workplace';
        else if (cat === 'trip') titleLabel.textContent = 'Destination / Trip Name';
        else if (cat === 'person') titleLabel.textContent = 'Person Name';
        else if (cat === 'pet') titleLabel.textContent = 'Pet Name / Species';
        else titleLabel.textContent = 'Event Title';
      }
    });

    // Voice Input & Natural Language Age/Year AI Parser
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => voiceBtn.classList.add('recording');
      recognition.onend = () => voiceBtn.classList.remove('recording');

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('detailsInput').value += (document.getElementById('detailsInput').value ? ' ' : '') + transcript;
        parseSpeechForYearAndCategory(transcript);
      };

      voiceBtn.addEventListener('click', () => {
        if (voiceBtn.classList.contains('recording')) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });
    } else {
      voiceBtn.style.display = 'none';
    }

    // Smart Speech Parser (Deciphers Spoken Age & Year Logic)
    function parseSpeechForYearAndCategory(text) {
      const lower = text.toLowerCase();

      // Look for Age references: "when I was 32", "at age 25", "I was 30"
      const ageMatch = lower.match(/(?:when i was|at age|i was)\s+(\d{1,2})/i);
      if (ageMatch) {
        const spokenAge = parseInt(ageMatch[1]);
        const calculatedYear = BIRTH_YEAR + spokenAge;
        if (calculatedYear >= BIRTH_YEAR && calculatedYear <= CURRENT_YEAR) {
          yearSelect.value = calculatedYear;
          updateAgeDisplay();
        }
      }

      // Look for Direct Year references: "in 2006", "back in 1998"
      const yearMatch = lower.match(/\b(19\d\d|20\d\d)\b/);
      if (yearMatch) {
        const spokenYear = parseInt(yearMatch[1]);
        if (spokenYear >= BIRTH_YEAR && spokenYear <= CURRENT_YEAR) {
          yearSelect.value = spokenYear;
          updateAgeDisplay();
        }
      }

      // Infer Category keywords
      if (lower.includes('moved to') || lower.includes('lived in') || lower.includes('house')) {
        categorySelect.value = 'place';
      } else if (lower.includes('worked at') || lower.includes('job') || lower.includes('hired')) {
        categorySelect.value = 'job';
      } else if (lower.includes('traveled') || lower.includes('trip') || lower.includes('flight') || lower.includes('visited')) {
        categorySelect.value = 'trip';
      } else if (lower.includes('cat') || lower.includes('dog') || lower.includes('pet')) {
        categorySelect.value = 'pet';
      }
      categorySelect.dispatchEvent(new Event('change'));
    }

    // Save Memory Form
    memoryForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const category = categorySelect.value;
      const year = parseInt(yearSelect.value);
      const title = document.getElementById('titleInput').value.trim();
      const details = document.getElementById('detailsInput').value.trim();
      const photoFileInput = document.getElementById('photoFile');

      let photoData = null;
      if (category === 'photo' && photoFileInput.files && photoFileInput.files[0]) {
        photoData = await convertFileToBase64(photoFileInput.files[0]);
      }

      const newMemory = {
        id: Date.now().toString(),
        category,
        year,
        age: year - BIRTH_YEAR,
        title,
        details,
        photoData,
        createdAt: new Date().toISOString()
      };

      memories.push(newMemory);
      saveMemories();
      renderTimeline();

      // Reset form
      memoryForm.reset();
      categorySelect.dispatchEvent(new Event('change'));
      scrollToYear(year);
    });

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function saveMemories() {
      localStorage.setItem('life_journal_memories', JSON.stringify(memories));
    }

    function deleteMemory(id) {
      if (confirm('Delete this memory?')) {
        memories = memories.filter(m => m.id !== id);
        saveMemories();
        renderTimeline();
      }
    }

    // Render Timeline grouped by Year
    function renderTimeline() {
      timelineContainer.innerHTML = '';

      if (memories.length === 0) {
        timelineContainer.innerHTML = `
          <div class="empty-state">
            <p>🌟 Your timeline is ready to receive your memories.</p>
            <p style="font-size: 0.85rem; margin-top: 6px;">Use the voice button or form above to begin adding life events.</p>
          </div>
        `;
        return;
      }

      // Group memories by year in descending order
      const grouped = {};
      memories.forEach(m => {
        if (!grouped[m.year]) grouped[m.year] = [];
        grouped[m.year].push(m);
      });

      const sortedYears = Object.keys(grouped).sort((a, b) => b - a);

      sortedYears.forEach(year => {
        const age = year - BIRTH_YEAR;
        const yearSection = document.createElement('div');
        yearSection.className = 'year-section';
        yearSection.id = `year-section-${year}`;

        yearSection.innerHTML = `
          <div class="year-heading">
            <h3>${year}</h3>
            <span>• Age ${age}</span>
          </div>
        `;

        grouped[year].forEach(m => {
          const card = document.createElement('div');
          card.className = 'memory-card';

          const catTagClass = `tag-${m.category}`;
          const catLabel = getCategoryLabel(m.category);

          card.innerHTML = `
            <div class="card-top">
              <span class="category-tag ${catTagClass}">${catLabel}</span>
              <div class="card-actions">
                <button class="delete-btn" onclick="deleteMemory('${m.id}')" title="Delete">🗑️</button>
              </div>
            </div>
            <div class="memory-title">${escapeHtml(m.title)}</div>
            ${m.details ? `<div class="memory-desc">${escapeHtml(m.details)}</div>` : ''}
            ${m.photoData ? `<img src="${m.photoData}" class="memory-img" alt="Memory photo" />` : ''}
          `;
          yearSection.appendChild(card);
        });

        timelineContainer.appendChild(yearSection);
      });
    }

    function getCategoryLabel(cat) {
      const map = {
        photo: '📸 Photo',
        place: '🏡 Place',
        job: '💼 Job',
        trip: '✈️ Trip',
        event: '🎉 Event',
        person: '👥 Person',
        pet: '🐾 Pet'
      };
      return map[cat] || 'Memory';
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // JSON Backup Export & Import
    exportBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(memories, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `life_journal_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    importBtn.addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            memories = imported;
            saveMemories();
            renderTimeline();
            alert('Journal timeline successfully restored!');
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Failed to parse JSON file.');
        }
      };
      reader.readAsText(file);
    });

    // Initialize App
    initYearPickers();
    renderTimeline();
  </script>
</body>
</html>
